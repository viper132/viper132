<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="1" />
    </pattern>

    <!-- Scanline Sweep Gradient -->
    <linearGradient id="scan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#39d353" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>

    <!-- Mask to keep scanline strictly inside the frame -->
    <mask id="frame-mask">
      <rect width="840" height="220" rx="8" fill="#ffffff" />
    </mask>
  </defs>

  <style>
    .mono { font-family: 'Departure Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
    .label { font-size: 11px; fill: #7d8590; letter-spacing: 1.5px; }
    .title { font-size: 26px; fill: #f0f6fc; font-weight: 700; letter-spacing: 2px; }
    .subtitle { font-size: 13px; fill: #58a6ff; font-weight: 600; letter-spacing: 1px; }
    .pill-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 3px; }
    .pill-text { font-size: 11px; fill: #c9d1d9; font-weight: 500; }
    .accent { fill: #39d353; font-weight: 700; }
  </style>

  <!-- Base Canvas -->
  <rect width="840" height="220" fill="#0d1117" rx="8" />
  <rect width="840" height="220" fill="url(#grid)" rx="8" />
  <rect x="1" y="1" width="838" height="218" fill="none" stroke="#30363d" stroke-width="1.5" rx="8" />

  <!-- Animated CRT Scanline Sweep -->
  <g mask="url(#frame-mask)">
    <line x1="0" y1="0" x2="840" y2="0" stroke="url(#scan-glow)" stroke-width="2">
      <animate attributeName="y1" values="-10;230;-10" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="-10;230;-10" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Corner Tech Brackets -->
  <path d="M 8 20 L 8 8 L 20 8" fill="none" stroke="#58a6ff" stroke-width="2" />
  <path d="M 832 20 L 832 8 L 820 8" fill="none" stroke="#58a6ff" stroke-width="2" />
  <path d="M 8 200 L 8 212 L 20 212" fill="none" stroke="#58a6ff" stroke-width="2" />
  <path d="M 832 200 L 832 212 L 820 212" fill="none" stroke="#58a6ff" stroke-width="2" />

  <!-- Top System Header Bar -->
  <line x1="25" y1="36" x2="815" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- Left Status: Pulsing Beacon + Console ID -->
  <g transform="translate(30, 24)">
    <circle cx="4" cy="0" r="4" fill="#39d353">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="4" cy="0" r="4" fill="none" stroke="#39d353" stroke-width="1.2">
      <animate attributeName="r" values="4;11;11" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="16" y="3" class="mono label">SYS_ID // VIPER132:CONSOLE</text>
  </g>

  <!-- Right Status: Right-aligned single text flow (Zero collision risk) -->
  <text x="810" y="27" class="mono label" text-anchor="end">
    <tspan fill="#7d8590">CORE: </tspan><tspan fill="#39d353">OPERATIONAL</tspan>
    <tspan fill="#30363d"> &#9474; </tspan>
    <tspan fill="#7d8590">GRID: </tspan><tspan fill="#39d353">230V / 100%</tspan>
    <tspan fill="#30363d"> &#9474; </tspan>
    <tspan fill="#7d8590">LOC: </tspan><tspan fill="#58a6ff">ID/WIB</tspan>
  </text>

  <!-- Main Hero Info -->
  <text x="32" y="76" class="mono subtitle">&gt; ROOT_TERMINAL // INITIALIZED<tspan fill="#39d353"> █<animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite" /></tspan></text>
  <text x="32" y="112" class="mono title">HUGO MULANA CHRISTON</text>
  <text x="32" y="138" class="mono subtitle">GEOSPATIAL SYSTEMS ENGINEER <tspan fill="#7d8590">&#8226;</tspan> HARDWARE TELEMETRY <tspan fill="#7d8590">&#8226;</tspan> NATIVE TOOLS</text>

  <!-- Status Pills Matrix -->
  <!-- Pill 1: GlazeWM -->
  <rect x="32" y="162" width="168" height="28" class="pill-bg" />
  <text x="44" y="180" class="mono pill-text"><tspan fill="#7d8590">ENV:</tspan> Win11 + GlazeWM</text>

  <!-- Pill 2: Hardware Telemetry -->
  <rect x="210" y="162" width="180" height="28" class="pill-bg" />
  <text x="222" y="180" class="mono pill-text"><tspan fill="#7d8590">PWR:</tspan> APC-UPS Telemetry</text>

  <!-- Pill 3: Homelab -->
  <rect x="400" y="162" width="195" height="28" class="pill-bg" />
  <text x="412" y="180" class="mono pill-text"><tspan fill="#7d8590">HOMELAB:</tspan> ZimaOS + Debian</text>

  <!-- Pill 4: Zero Bloat -->
  <rect x="605" y="162" width="202" height="28" class="pill-bg" />
  <text x="617" y="180" class="mono pill-text"><tspan class="accent">&gt;_</tspan> ZERO-BLOAT PIPELINE</text>

  <!-- Kinetic Telemetry Equalizer Bars (Live Dynamic Audio/Power Frequencies) -->
  <!-- Baseline at y=52 inside coordinate group (y+h = 52) -->
  <g transform="translate(715, 65)">
    <!-- Bar 0 -->
    <rect x="0" y="32" width="5" height="20" rx="1.5" fill="#21262d">
      <animate attributeName="height" values="14;28;10;22;14" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="38;24;42;30;38" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 1 -->
    <rect x="10" y="24" width="5" height="28" rx="1.5" fill="#30363d">
      <animate attributeName="height" values="24;42;16;36;24" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="28;10;36;16;28" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="20" y="12" width="5" height="40" rx="1.5" fill="#58a6ff">
      <animate attributeName="height" values="36;48;20;44;36" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="16;4;32;8;16" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="30" y="20" width="5" height="32" rx="1.5" fill="#39d353">
      <animate attributeName="height" values="28;50;18;40;28" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="24;2;34;12;24" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="40" y="8" width="5" height="44" rx="1.5" fill="#58a6ff">
      <animate attributeName="height" values="44;24;48;18;44" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;28;4;34;8" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="50" y="18" width="5" height="34" rx="1.5" fill="#39d353">
      <animate attributeName="height" values="32;46;14;38;32" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;6;38;14;20" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="60" y="26" width="5" height="26" rx="1.5" fill="#58a6ff">
      <animate attributeName="height" values="22;38;12;30;22" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;14;40;22;30" dur="2.0s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 7 -->
    <rect x="70" y="20" width="5" height="32" rx="1.5" fill="#30363d">
      <animate attributeName="height" values="30;18;42;12;30" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="22;34;10;40;22" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 8 -->
    <rect x="80" y="32" width="5" height="20" rx="1.5" fill="#21262d">
      <animate attributeName="height" values="16;26;8;22;16" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="36;26;44;30;36" dur="2.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
